services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitsecure
      POSTGRES_PASSWORD: splitsecure
      POSTGRES_DB: splitsecure
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5433, not 5432 - this machine already has a native
      # PostgreSQL service bound to 5432, which silently wins host-side
      # connections over Docker's forwarded port. Container-to-container
      # traffic (backend -> postgres:5432) is unaffected either way since
      # it goes over the Docker network, not this host mapping.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitsecure"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://splitsecure:splitsecure@postgres:5432/splitsecure
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
