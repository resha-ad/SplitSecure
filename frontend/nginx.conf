server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - all client-side routes resolve to index.html
    location / {
        try_files $uri /index.html;
    }

    # Defence-in-depth headers at the edge, in addition to the API's own
    # Helmet-set headers - relevant here because this is what actually
    # serves the HTML document and static assets to the browser.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~* \.(?:css|js|svg|png|jpg|jpeg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
